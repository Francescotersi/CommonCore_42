# host HTTPS per WordPress
server {
	listen 443 ssl;
	listen [::]:443 ssl;

	server_name ftersill.42.fr vbachele.42.fr;

	ssl_certificate /etc/nginx/ssl/file.crt;
	ssl_certificate_key /etc/nginx/ssl/file.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;

	root /var/www/html;
	index index.php index.html index.htm;

	# static prima, fallback a index.php
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# gestione PHP via FastCGI (php-fpm su wordpress:9000)
	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_pass wordpress:9000;
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param SCRIPT_NAME $fastcgi_script_name;
	}

}